apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      containers:
        - name: web
          image: ghcr.io/ansibleking/inventory-app:initial
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: demo-db-rw.pg-demo.svc.cluster.local
            - name: DB_NAME
              value: inventory
            - name: APP_VERSION
              value: "initial"
          envFrom:
            - secretRef:
                name: inventory-db
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
